# Local / single-host stack: Postgres, Redis, migrations, API, worker, Studio.
# One command (creates .env and a bootstrap key on first run): scripts/local/archai.sh up
# Manual equivalent:
#   python3 scripts/local/init_env.py
#   docker compose --env-file .env -f infrastructure/docker/docker-compose.yml up -d --build --wait
# For a production host set ARCHAI_ENV=production (the API then refuses unsafe settings).
x-restart: &restart
  restart: unless-stopped

x-api-image: &api-image
  image: archai-api:local
  build:
    context: ../..
    dockerfile: apps/api/Dockerfile
    args:
      TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}

x-database-url: &database-url postgresql+psycopg://archai:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (run scripts/local/init_env.py)}@postgres:5432/archai

services:
  migrate:
    <<: *api-image
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
  generator-init:
    <<: *api-image
    # Trains the small CPU generator once (about 10-60 s) into the artifact volume; skipped when the
    # checkpoint exists or ARCHAI_TRAIN_GENERATOR=0. See docs/GENERATOR.md.
    command: ["sh", "-c", "if [ \"$${ARCHAI_TRAIN_GENERATOR}\" = 0 ] || [ -f \"$${ARCHAI_GENERATOR_CHECKPOINT}\" ]; then echo 'generator checkpoint: nothing to do'; else python scripts/train_generator_local.py --checkpoint \"$${ARCHAI_GENERATOR_CHECKPOINT}\" --report /var/lib/archai/generator/local-report.json; fi"]
    environment:
      ARCHAI_TRAIN_GENERATOR: ${ARCHAI_TRAIN_GENERATOR:-1}
      ARCHAI_GENERATOR_CHECKPOINT: /var/lib/archai/generator/local.pt
    volumes:
      - archai-artifacts:/var/lib/archai
    restart: "no"
  api:
    <<: [*restart, *api-image]
    command: ["sh", "-c", "exec uvicorn archai_api.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips \"$${FORWARDED_ALLOW_IPS}\" --workers \"$${WEB_CONCURRENCY}\""]
    environment:
      ARCHAI_ENV: ${ARCHAI_ENV:-development}
      ARCHAI_API_KEY: ${ARCHAI_API_KEY:-}
      ARCHAI_API_KEY_SHA256: ${ARCHAI_API_KEY_SHA256:-}
      ARCHAI_REQUIRE_API_KEY: ${ARCHAI_REQUIRE_API_KEY:-0}
      ARCHAI_PROTECT_READS: ${ARCHAI_PROTECT_READS:-0}
      ARCHAI_CORS_ORIGINS: ${ARCHAI_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      DATABASE_URL: *database-url
      ARCHAI_REDIS_URL: redis://redis:6379/0
      ARCHAI_REQUIRE_REDIS: "1"
      ARCHAI_ARTIFACT_STORE: /var/lib/archai/experiments.jsonl
      ARCHAI_AUDIT_LOG: /var/lib/archai/audit/api-writes.jsonl
      ARCHAI_ALLOWED_PATHS: /var/lib/archai:/opt/archai/datasets
      ARCHAI_GENERATOR_CHECKPOINT: ${ARCHAI_GENERATOR_CHECKPOINT:-/var/lib/archai/generator/local.pt}
      ARCHAI_LATENCY_MAX_SECONDS: ${ARCHAI_LATENCY_MAX_SECONDS:-20}
      ARCHAI_RATE_LIMIT_PER_MINUTE: ${ARCHAI_RATE_LIMIT_PER_MINUTE:-120}
      ARCHAI_RATE_LIMIT_GET_PER_MINUTE: ${ARCHAI_RATE_LIMIT_GET_PER_MINUTE:-600}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    volumes:
      - archai-artifacts:/var/lib/archai
    ports: ["${ARCHAI_BIND_ADDRESS:-127.0.0.1}:${ARCHAI_API_PORT:-8000}:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      generator-init: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readiness', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
  worker:
    <<: [*restart, *api-image]
    command: ["python", "-m", "archai_api.worker"]
    environment:
      ARCHAI_REDIS_URL: redis://redis:6379/0
      # Defaults to the bundled 256-cell NATS-Bench fixture (fixture-only, not a research result).
      # Point these at the full archive for real searches; see docs/deploy/LOCAL.md.
      ARCHAI_NATS_BENCH_PATH: ${ARCHAI_NATS_BENCH_PATH:-/opt/archai/datasets/fixtures/natsbench-tss-cifar10-256/cells.jsonl}
      ARCHAI_NATS_BENCH_SHA256: ${ARCHAI_NATS_BENCH_SHA256:-4a4b956ad6ae53b9d0b17fcf04b4935d17db030661afe23bbdb111c27ac5a148}
      ARCHAI_NATS_BENCH_INDICES: ${ARCHAI_NATS_BENCH_INDICES:-}
      ARCHAI_NATS_BENCH_SEARCH_SPACE: ${ARCHAI_NATS_BENCH_SEARCH_SPACE:-tss}
      ARCHAI_BENCHMARK_CACHE: /var/lib/archai/benchmark-cache.sqlite
      # Candidate checkpoints land in the shared volume so the API can register and deploy them.
      ARCHAI_CHECKPOINT_DIR: /var/lib/archai/checkpoints
      ARCHAI_ALLOWED_PATHS: /var/lib/archai:/opt/archai/datasets
    volumes:
      - archai-artifacts:/var/lib/archai
      - ../../datasets/raw:/var/lib/archai/datasets:ro
    healthcheck:
      disable: true
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  web:
    <<: *restart
    image: archai-studio:local
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_ARCHAI_API_URL: ${ARCHAI_PUBLIC_API_URL:-http://localhost:8000}
    ports: ["${ARCHAI_BIND_ADDRESS:-127.0.0.1}:${ARCHAI_WEB_PORT:-3000}:3000"]
    depends_on:
      api: {condition: service_healthy}
  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: archai
      POSTGRES_USER: archai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (run scripts/local/init_env.py)}
    volumes: ["archai-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U archai -d archai"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    <<: *restart
    image: redis:7-alpine
    # The job queue lives in Redis; append-only persistence keeps queued jobs across restarts.
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["archai-redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  archai-artifacts:
  archai-postgres:
  archai-redis:
