services:
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      ARCHAI_API_KEY: ${ARCHAI_API_KEY:-}
      ARCHAI_ARTIFACT_STORE: /var/lib/archai/experiments.jsonl
    volumes:
      - archai-artifacts:/var/lib/archai
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  worker:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "archai_api.worker"]
    environment:
      ARCHAI_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis: {condition: service_healthy}
    profiles: ["worker"]
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_ARCHAI_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: archai
      POSTGRES_USER: archai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: ["archai-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archai -d archai"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  archai-artifacts:
  archai-postgres:
