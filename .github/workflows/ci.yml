name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[dev,platform]'
      - run: ruff check .
      - run: pytest
      - run: python -m compileall -q packages apps scripts
      - name: Verify fresh Alembic schema is at head
        run: |
          db_path=$(mktemp --suffix=.sqlite)
          DATABASE_URL="sqlite:///$db_path" python -m alembic upgrade head
          DATABASE_URL="sqlite:///$db_path" python - <<'PY'
          import os, subprocess, sys

          def run(args):
              return subprocess.check_output(args, env=os.environ, text=True).strip()

          current = run([sys.executable, "-m", "alembic", "current"])
          heads = run([sys.executable, "-m", "alembic", "heads"])

          def ids(text):
              return {line.split()[0] for line in text.splitlines() if line.strip()}

          current_ids, head_ids = ids(current), ids(heads)
          if not current_ids or current_ids != head_ids:
              raise SystemExit(f"current {current!r} does not match heads {heads!r}")
          print(f"at head: {current}")
          PY
      - name: Validate Compose configuration
        run: POSTGRES_PASSWORD=ci-only docker compose -f infrastructure/docker/docker-compose.yml config --quiet
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - name: Install with CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip 'setuptools>=84.1'
          python -m pip install -e '.[dev,platform,ml,benchmark]' pip-audit --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Python dependency audit
        # torch/torchvision CPU wheels come from the PyTorch index and are reported as skipped.
        run: pip-audit --skip-editable --progress-spinner off
      - name: Static security lint (ruff flake8-bandit rules)
        # Ignored: asserts (S101), non-crypto RNG for seeded research (S311), /tmp dev defaults
        # that production overrides (S108), git subprocess calls in research scripts (S603/S607),
        # and intentional best-effort except blocks (S110/S112).
        run: ruff check --select S --ignore S101,S108,S110,S112,S311,S603,S607 packages apps/api scripts
      - name: Studio dependency audit
        working-directory: apps/web
        run: |
          npm ci
          npm audit --audit-level=high
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t archai-api:ci .
      - name: Build Studio image
        run: docker build -f apps/web/Dockerfile --build-arg NEXT_PUBLIC_ARCHAI_API_URL=http://127.0.0.1:8000 -t archai-web:ci .
      - name: Smoke-test images
        run: |
          docker run -d --name api -p 8000:8000 archai-api:ci
          docker run -d --name web -p 3000:3000 archai-web:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && curl -fsS -o /dev/null http://127.0.0.1:3000/ && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsSI http://127.0.0.1:8000/health | grep -i '^x-content-type-options: nosniff'
          curl -fsSI http://127.0.0.1:3000/ | grep -i '^content-security-policy:'
          docker exec api id -u | grep -qx 10001
          docker exec api python -c "import archai_api.worker, scripts.train_generator"
          docker run --rm -e ARCHAI_ENV=production archai-api:ci python -c "from archai_api import settings; errors = settings.configuration_errors(); print(errors); assert errors"
      - name: Container logs
        if: always()
        run: docker logs api; docker logs web
      - name: Boot the local compose stack from a clean checkout and smoke-test it
        run: |
          docker rm -f api web
          docker tag archai-api:ci archai-api:local
          docker tag archai-web:ci archai-studio:local
          python3 scripts/local/init_env.py
          docker compose --env-file .env -f infrastructure/docker/docker-compose.yml up -d --no-build --wait --wait-timeout 600
          scripts/local/archai.sh smoke
      - name: Compose logs
        if: failure()
        run: docker compose --env-file .env -f infrastructure/docker/docker-compose.yml logs --tail 150
  python-torch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install with CPU-only PyTorch
        run: python -m pip install -e '.[dev,platform,ml]' --extra-index-url https://download.pytorch.org/whl/cpu
      - run: pytest
  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
  studio-e2e:
    name: studio-e2e (fixture-only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: archai
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: archai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U archai -d archai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://archai:ci@127.0.0.1:5432/archai
      ARCHAI_REDIS_URL: redis://127.0.0.1:6379/0
      NEXT_PUBLIC_ARCHAI_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - name: Install Python (CPU torch, no official NATS-Bench archive)
        run: python -m pip install -e '.[dev,platform,ml]' --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Install Studio and Playwright Chromium
        working-directory: apps/web
        run: |
          npm ci
          PLAYWRIGHT_VERSION=$(node -p "require('playwright-core/package.json').version")
          npx --yes playwright@${PLAYWRIGHT_VERSION} install --with-deps chromium
      - name: Build Studio
        working-directory: apps/web
        run: npm run build
      - name: Run browser E2E against a fixture-only stack
        run: bash scripts/ci_e2e_stack.sh
