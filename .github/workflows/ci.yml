name: CI
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[dev,platform]'
      - run: pytest
      - run: python -m compileall -q packages apps scripts
      - name: Verify fresh Alembic schema
        run: |
          db_path=$(mktemp --suffix=.sqlite)
          DATABASE_URL="sqlite:///$db_path" python -m alembic upgrade head
          DATABASE_URL="sqlite:///$db_path" python -m alembic current | grep 0006_experiment_started_at
      - name: Validate Compose configuration
        run: POSTGRES_PASSWORD=ci-only docker compose -f infrastructure/docker/docker-compose.yml config --quiet
  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: npm, cache-dependency-path: apps/web/package.json}
      - run: npm install
      - run: npm run build
