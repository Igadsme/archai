# PROPOSED replacement for .github/workflows/ci.yml.
# A normal push of this file to .github/workflows/ci.yml was rejected twice on 2026-11-25
# (America/New_York) with:
#   refusing to allow a Personal Access Token to create or update workflow
#   `.github/workflows/ci.yml` without `workflow` scope
# Local unpushed workflow commits were reset (not force-pushed). See BLOCKERS B5/B9.
# Changes vs the workflow still on the branch: ruff, Node 22, npm ci, Alembic head
# 0007_research_projects, a CPU-only torch pytest job, and a workflow_dispatch Studio E2E job.
name: CI
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[dev,platform]'
      - run: ruff check .
      - run: pytest
      - run: python -m compileall -q packages apps scripts
      - name: Verify fresh Alembic schema
        run: |
          db_path=$(mktemp --suffix=.sqlite)
          DATABASE_URL="sqlite:///$db_path" python -m alembic upgrade head
          DATABASE_URL="sqlite:///$db_path" python -m alembic current | grep 0007_research_projects
      - name: Validate Compose configuration
        run: POSTGRES_PASSWORD=ci-only docker compose -f infrastructure/docker/docker-compose.yml config --quiet
  python-torch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install with CPU-only PyTorch
        run: python -m pip install -e '.[dev,platform,ml]' --extra-index-url https://download.pytorch.org/whl/cpu
      - run: pytest
  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
  studio-e2e:
    # Browser E2E needs the live API, worker, Postgres, Redis, and the
    # checksum-verified NATS-Bench archive, which GitHub-hosted runners do not have.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run Studio browser E2E against a provided live stack
        env:
          STUDIO_URL: ${{ secrets.ARCHAI_E2E_STUDIO_URL }}
          API_URL: ${{ secrets.ARCHAI_E2E_API_URL }}
          ARCHAI_E2E_API_KEY_FILE: ${{ secrets.ARCHAI_E2E_API_KEY_FILE }}
        run: node e2e/studio.e2e.mjs
